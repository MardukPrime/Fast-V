name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.3.0-pre.1)"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve tag and version
        id: meta
        env:
          TAG_INPUT: ${{ inputs.tag }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${TAG_INPUT}"
          else
            tag="${REF_NAME}"
          fi
          tag="$(printf '%s' "${tag}" | tr -d '[:space:]')"
          if [ -z "${tag}" ]; then
            echo "release tag is required" >&2
            exit 1
          fi
          case "${tag}" in
            v*) ;;
            *) echo "release tag must start with 'v': ${tag}" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "invalid semver in tag: ${version}" >&2
            exit 1
          fi
          prerelease=false
          case "${version}" in
            *-*) prerelease=true ;;
          esac
          if [ "${PRERELEASE_INPUT}" = "true" ]; then
            prerelease=true
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"
          echo "tag=${tag} version=${version} prerelease=${prerelease}"

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    needs: [meta, frontend]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build Windows executable
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = @(
            '-w', '-s', '-H', 'windowsgui',
            "-X", "github.com/MardukPrime/Fast-V/internal/buildinfo.Version=$env:APP_VERSION",
            "-X", "github.com/MardukPrime/Fast-V/internal/buildinfo.Commit=$env:GITHUB_SHA",
            "-X", "github.com/MardukPrime/Fast-V/internal/buildinfo.BuildDate=$buildDate"
          ) -join ' '
          go build -tags production -trimpath -buildvcs=false -ldflags="$ldflags" -o dist/Fast-V.exe .
          if (-not (Test-Path dist/Fast-V.exe)) { throw "build did not produce dist/Fast-V.exe" }
          Write-Host ("Built Fast-V.exe: {0:N1} MB" -f ((Get-Item dist/Fast-V.exe).Length / 1MB))

      - name: Package Windows asset
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          Copy-Item LICENSE, README.md dist/
          Compress-Archive -Path dist/Fast-V.exe, LICENSE, README.md -DestinationPath "dist/FastV-$env:APP_VERSION-windows-amd64.zip" -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Install NSIS
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "makensis already available"
            exit 0
          }
          choco install nsis -y --no-progress
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            throw "NSIS installation did not provide makensis.exe"
          }
          Write-Host "NSIS installed"

      - name: Build Windows installer (NSIS)
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source }
          }
          if (-not $makensis) { throw "makensis (NSIS) not found on the runner" }
          # VIProductVersion requires X.X.X.X; turn 0.6.0-pre.2 into 0.6.0.2.
          $parts = @()
          foreach ($part in ($env:APP_VERSION -replace '-', '.' -split '\.')) {
            if ($part -match '^\d+$') { $parts += $part }
          }
          while ($parts.Count -lt 4) { $parts += '0' }
          $fileVersion = ($parts[0..3] -join '.')
          $outFile = Join-Path (Get-Location) "dist\FastV-$env:APP_VERSION-windows-amd64-setup.exe"
          & $makensis "/DAPP_VERSION=$env:APP_VERSION" "/DAPP_FILE_VERSION=$fileVersion" "/DSOURCE_DIR=$(Join-Path (Get-Location) 'dist')" "/DOUT_FILE=$outFile" "/DASSETS_DIR=$(Join-Path (Get-Location) 'assets')" "packaging\windows\fastv.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $outFile)) { throw "installer was not created: $outFile" }
          Write-Host ("Built installer: {0:N1} MB (file version {1})" -f ((Get-Item $outFile).Length / 1MB), $fileVersion)
          Get-ChildItem dist | Format-Table Name, Length

      - name: Smoke test Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $setup = Join-Path (Get-Location) "dist\FastV-$env:APP_VERSION-windows-amd64-setup.exe"
          $installDir = Join-Path $env:ProgramFiles "FastV"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $proc = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "silent install failed with exit code $($proc.ExitCode)" }
          $exe = Join-Path $installDir "Fast-V.exe"
          if (-not (Test-Path $exe)) { throw "installer did not install Fast-V.exe" }
          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $uninstaller)) { throw "installer did not create uninstall.exe" }
          $size = (Get-Item $exe).Length
          if ($size -lt 5MB) { throw "installed executable is unexpectedly small: $size bytes" }
          Write-Host ("Installed Fast-V.exe: {0:N1} MB" -f ($size / 1MB))
          $uninstallProc = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $installDir "Fast-V.exe")) { throw "uninstaller did not remove Fast-V.exe" }
          Write-Host "Windows installer smoke test passed (install + uninstall)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (arm64 + amd64)
    needs: [meta, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build and package macOS apps
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for arch in arm64 amd64; do
            rm -rf stage
            mkdir -p "stage/FastV.app/Contents/MacOS" "stage/FastV.app/Contents/Resources"
            GOOS=darwin GOARCH="${arch}" go build -tags "production purego" -trimpath -buildvcs=false \
              -ldflags "-w -s -X github.com/MardukPrime/Fast-V/internal/buildinfo.Version=${APP_VERSION} -X github.com/MardukPrime/Fast-V/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/MardukPrime/Fast-V/internal/buildinfo.BuildDate=${build_date}" \
              -o "stage/FastV.app/Contents/MacOS/Fast-V" .
            cp LICENSE README.md stage/
            cp assets/appicon.icns "stage/FastV.app/Contents/Resources/appicon.icns"
            cat > "stage/FastV.app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>FastV</string>
            <key>CFBundleExecutable</key><string>Fast-V</string>
            <key>CFBundleIconFile</key><string>appicon</string>
            <key>CFBundleIdentifier</key><string>com.mardukprime.fastv</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>FastV</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${APP_VERSION}</string>
            <key>CFBundleVersion</key><string>${GITHUB_SHA}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST
            (cd stage && zip -q -r -X "../dist/FastV-${APP_VERSION}-macos-${arch}.zip" FastV.app LICENSE README.md)
            echo "packaged macos/${arch}"
          done
          ls -la dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  android:
    name: Android (arm64 APK + AAB)
    needs: [meta, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "preinstalled sdkmanager not found; installing command-line tools"
            mkdir -p "$HOME/android-cmdline-tools"
            curl -fsSL -o "$HOME/android-cmdline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
            unzip -q "$HOME/android-cmdline-tools.zip" -d "$HOME/android-cmdline-tools"
            SDKMANAGER="$HOME/android-cmdline-tools/cmdline-tools/bin/sdkmanager"
            ANDROID_HOME="$HOME/android-sdk"
            export ANDROID_HOME
            mkdir -p "$ANDROID_HOME"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform, build tools and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Wails CLI
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Prepare Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; artifacts will be debug-signed (sideload only)."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fastv-release.jks"
          chmod 600 "$RUNNER_TEMP/fastv-release.jks"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/fastv-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Release keystore configured."

      - name: Build Android shared library, APK and AAB
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Version the Android build from the release version.
          base_version="${APP_VERSION%%-*}"
          IFS=. read -r major minor patch <<< "$base_version"
          version_code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          # build/config.yml is local-only; overlay generation reads defaults.
          sed -i "s/versionCode = .*/versionCode = ${version_code}/" packaging/android/app/build.gradle
          sed -i "s/versionName = \".*\"/versionName = \"${APP_VERSION}\"/" packaging/android/app/build.gradle

          wails3 android overlay:gen -out packaging/android/overlay.json

          NDK_ROOT=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="$TOOLCHAIN/bin/aarch64-linux-android21-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android21-clang++"
          export CGO_ENABLED=1 GOOS=android GOARCH=arm64

          mkdir -p packaging/android/app/src/main/jniLibs/arm64-v8a
          go build -buildmode=c-shared -overlay packaging/android/overlay.json \
            -tags "production,android" -trimpath -buildvcs=false \
            -ldflags "-w -s -X github.com/MardukPrime/Fast-V/internal/buildinfo.Version=${APP_VERSION} -X github.com/MardukPrime/Fast-V/internal/buildinfo.Commit=${GITHUB_SHA}" \
            -o packaging/android/app/src/main/jniLibs/arm64-v8a/libwails.so

          cd packaging/android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          cd ../..
          mkdir -p dist
          cp packaging/android/app/build/outputs/apk/release/app-release.apk "dist/FastV-${APP_VERSION}-android-arm64.apk"
          cp packaging/android/app/build/outputs/bundle/release/app-release.aab "dist/FastV-${APP_VERSION}-android-arm64.aab"
          ls -la dist

      - name: Verify APK and AAB packages
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          apk="dist/FastV-${APP_VERSION}-android-arm64.apk"
          aab="dist/FastV-${APP_VERSION}-android-arm64.aab"
          test -f "$apk"
          test -f "$aab"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libwails.so"
          unzip -l "$aab" | grep -q "base/manifest/AndroidManifest.xml"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$apk" | head -6
          unzip -l "$apk" | grep -q "AndroidManifest.xml"
          echo "APK OK: $(du -h "$apk" | cut -f1)"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (amd64 + arm64)
    needs: [meta, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download appimagetool
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/appimage"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/appimage/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "${RUNNER_TEMP}/appimage/appimagetool"
          "${RUNNER_TEMP}/appimage/appimagetool" --version || true

      - name: Build and package Linux assets
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
          APPIMAGETOOL: ${{ runner.temp }}/appimage/appimagetool
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for arch in amd64 arm64; do
            rm -rf stage
            mkdir -p "stage/share/icons/hicolor/256x256/apps"
            GOOS=linux GOARCH="${arch}" go build -tags "production purego" -trimpath -buildvcs=false \
              -ldflags "-w -s -X github.com/MardukPrime/Fast-V/internal/buildinfo.Version=${APP_VERSION} -X github.com/MardukPrime/Fast-V/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/MardukPrime/Fast-V/internal/buildinfo.BuildDate=${build_date}" \
              -o stage/FastV .
            cp LICENSE README.md stage/
            cp assets/appicon.png "stage/share/icons/hicolor/256x256/apps/fastv.png"
            cat > stage/fastv.desktop <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=FastV
          Comment=Xray proxy client
          Exec=FastV
          Icon=fastv
          Terminal=false
          Categories=Network;
          DESKTOP
            tar -czf "dist/FastV-${APP_VERSION}-linux-${arch}.tar.gz" -C stage .
            bash packaging/linux/build-deb.sh stage/FastV "${arch}" "${APP_VERSION}" dist "${PWD}"
            if [ "${arch}" = "amd64" ] && [ -x "${APPIMAGETOOL}" ]; then
              bash packaging/linux/build-appimage.sh stage/FastV "${APPIMAGETOOL}" "${APP_VERSION}" dist "${PWD}"
            fi
            echo "packaged linux/${arch}"
          done
          ls -la dist
          echo "--- Debian package checks ---"
          dpkg-deb -I dist/FastV-${APP_VERSION}-linux-amd64.deb
          dpkg-deb -I dist/FastV-${APP_VERSION}-linux-arm64.deb
          dpkg-deb -c dist/FastV-${APP_VERSION}-linux-amd64.deb | grep -E '(/opt/fastv/FastV|/usr/bin/fastv|fastv.desktop)'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [meta, windows-x64, macos, linux, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and release info
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
          APP_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip *.tar.gz *.exe *.deb *.AppImage *.apk *.aab > SHA256SUMS.txt
          {
            echo "version=${APP_VERSION}"
            echo "tag=${APP_TAG}"
            echo "commit=${GITHUB_SHA}"
            echo ""
            echo "Platforms:"
            echo "- windows-amd64: Windows 10/11 x64 + Microsoft Edge WebView2 Runtime; portable zip or NSIS installer"
            echo "- macos-arm64: macOS 11+ (Apple Silicon), unsigned build - right-click > Open on first launch"
            echo "- macos-amd64: macOS 11+ (Intel), unsigned build - right-click > Open on first launch"
            echo "- linux-amd64 / linux-arm64: portable tar.gz or .deb; linux-amd64 also ships an AppImage; requires GTK3 and WebKitGTK 4.1 (libwebkit2gtk-4.1)"
            echo "- android-arm64: preview APK + Play-ready AAB (debug-signed unless ANDROID_KEYSTORE_BASE64 is configured); management features only, VPN/proxy pending"
            echo ""
            echo "macOS packages are not code-signed or notarized yet; users must allow them in System Settings."
            echo "In-app self update currently supports Windows only; macOS/Linux users should download the new package manually."
          } > release-info.txt
          ls -la
          cat SHA256SUMS.txt

      - name: Verify expected release assets
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          expected="windows-amd64.zip windows-amd64-setup.exe macos-arm64.zip macos-amd64.zip linux-amd64.tar.gz linux-amd64.deb linux-arm64.tar.gz linux-arm64.deb linux-amd64.AppImage android-arm64.apk android-arm64.aab"
          for suffix in ${expected}; do
            asset="FastV-${APP_VERSION}-${suffix}"
            if [ ! -f "${asset}" ]; then
              echo "missing release asset: ${asset}" >&2
              exit 1
            fi
          done
          echo "all expected release assets are present"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FastV v${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            FastV v${{ needs.meta.outputs.version }} — automated multi-platform build.

            | Platform | Asset | Requirements |
            |---|---|---|
            | Windows x64 (installer) | `FastV-${{ needs.meta.outputs.version }}-windows-amd64-setup.exe` | Windows 10/11 + WebView2 Runtime |
            | Windows x64 (portable) | `FastV-${{ needs.meta.outputs.version }}-windows-amd64.zip` | Windows 10/11 + WebView2 Runtime |
            | macOS Apple Silicon | `FastV-${{ needs.meta.outputs.version }}-macos-arm64.zip` | macOS 11+ (unsigned: right-click > Open) |
            | macOS Intel | `FastV-${{ needs.meta.outputs.version }}-macos-amd64.zip` | macOS 11+ (unsigned: right-click > Open) |
            | Linux x64 | `FastV-${{ needs.meta.outputs.version }}-linux-amd64.tar.gz` / `.deb` / `.AppImage` | GTK3 + WebKitGTK 4.1 |
            | Linux arm64 | `FastV-${{ needs.meta.outputs.version }}-linux-arm64.tar.gz` / `.deb` | GTK3 + WebKitGTK 4.1 |
